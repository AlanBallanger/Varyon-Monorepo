# VaryonUI Commands Configuration
# Max 5 buttons per row, overflow wraps to next row
# Première catégorie: bandeau + ligne rapide (5 cartes image)
# Type: "execute" (runs command directly) or "chat" (opens chat with command)
# icon_url (optionnel): chemin texture pack, ex. Icons/MonIcone.png — préfixe / ignoré. Emplacements UI avec icônes bouton: 1–35.
# header_icon (optionnel): icône du bandeau de catégorie (à côté du titre), ex. Icons/Menu_Utils.png — préfixe / ignoré.

[[category]]
name = "Se déplacer"
header_icon = "Icons/Movement_Category.png"

[[category.buttons]]
label = "Aller au spawn"
command = "/spawn"
type = "execute"

[[category.buttons]]
label = "tp random (haven)"
