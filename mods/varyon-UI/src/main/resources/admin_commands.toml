# VaryonUI Admin Commands Configuration
# Accessible uniquement aux joueurs avec la permission varyonui.admin (ou OP)
# Max 5 buttons per row, overflow wraps to next row
# Type: "execute" (runs command directly) or "chat" (opens chat with command)

##################################################
# ANNONCE
##################################################
[[category]]
name = "Annonce"

[[category.buttons]]
label = "Restart 1 min"
command = "/eventtitle --title \"Je restart le serveur dans 1 min\" --secondary Annonce"
type = "execute"

[[category.buttons]]
label = "Restart 10 sec"
command = "/eventtitle --title \"Je restart le serveur dans 10 secondes\" --secondary Annonce"
type = "execute"

##################################################
# HEAL
##################################################
[[category]]
name = "Heal"

[[category.buttons]]
